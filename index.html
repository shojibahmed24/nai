        /* --- app/index.css --- */
@tailwind base;
@tailwind components;
@tailwind utilities;

@layer base {
  body {
    @apply bg-gray-900 text-white antialiased;
  }
}

@layer utilities {
  .islamic-pattern-bg {
    background-color: #082b1a;
    background-image: radial-gradient(#0F5132 1px, transparent 1px);
    background-size: 20px 20px;
    position: relative;
  }
  
  .islamic-pattern-bg::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(180deg, rgba(8,43,26,0.4) 0%, rgba(8,43,26,0.9) 100%);
    pointer-events: none;
  }

  .glass-card {
    @apply bg-noor-green/40 backdrop-blur-md border border-noor-green-light/30 shadow-lg;
  }

  .gold-gradient-text {
    @apply bg-clip-text text-transparent bg-gradient-to-r from-noor-gold-light via-noor-gold to-noor-gold-dark;
  }
}

          console.error(errorMsg);
          if (window.innerHeight < 1000) {
             const div = document.createElement('div');
             div.style = "position:fixed;bottom:0;left:0;right:0;background:rgba(220,38,38,0.9);color:white;padding:10px;font-size:10px;z-index:99999;font-family:monospace;word-break:break-all;";
             div.innerText = errorMsg;
             document.body.appendChild(div);
             setTimeout(() => div.remove(), 8000);
          }
          window.parent.postMessage({
            type: 'RUNTIME_ERROR',
            error: { message, line: lineno, source: source ? source.split('/').pop() : 'index.html' }
          }, '*');
          return false;
        };

        window.addEventListener('load', function() {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              window.parent.postMessage({ type: 'PREVIEW_RENDER_OK' }, '*');
